<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Pyro Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/partials/styles.css">
  <style>
    body {
      background: radial-gradient(circle at center, #1e1e24 0%, #0f0f12 100%);
    }
  </style>
</head>
<body class="login-page">
  <main class="container">
    <article class="login-article">
      <div class="brand">
        <img src="/icon.svg" alt="Pyro Logo" style="width:48px;height:48px;">
        <h1>Pyro</h1>
        <p>Dashboard d'Administration du Bot</p>
      </div>
      
      <form action="/login" method="POST">
        <input type="hidden" name="_csrf" value="<%= locals._csrf || '' %>">
        <label for="token">Token du Bot Discord</label>
        <input type="password" id="token" name="token" placeholder="Saisir le token configuré..." required>
        
        <!-- Error Message Placeholder -->
        <% if (locals.error) { %>
          <p class="error-msg"><%= error %></p>
        <% } %>
        
        <button type="submit">Se connecter</button>
      </form>

      <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); text-align: center;">
        <a
          href="https://github.com/SkillFXX/pyro-discord-bot"
          target="_blank"
          rel="noopener noreferrer"
          style="font-size: 0.78rem; color: var(--text-muted); text-decoration: none;"
          onmouseover="this.style.color='#f8fafc'; this.style.textDecoration='underline';"
          onmouseout="this.style.color='var(--text-muted)'; this.style.textDecoration='none';"
        >
          Made by SkillFXX - PyroBot
        </a>
      </div>
    </article>
  </main>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
