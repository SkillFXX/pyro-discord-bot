<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Pyro Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/public/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/partials/styles.css">
  <style>
    body {
      background: radial-gradient(circle at center, #1e1e24 0%, #0f0f12 100%);
    }
  </style>
</head>
<body class="login-page">
  <main class="container">
    <article class="login-article">
      <div class="brand">
        <img src="/public/logo.png" alt="Pyro Logo" style="width:48px;height:48px;">
        <h1>Pyro</h1>
        <p>Dashboard d'Administration du Bot</p>
      </div>
      
      <form action="/login" method="POST">
        <label for="token">Token du Bot Discord</label>
        <input type="password" id="token" name="token" placeholder="Saisir le token configuré..." required>
        
        <!-- Error Message Placeholder -->
        <% if (locals.error) { %>
          <p class="error-msg"><%= error %></p>
        <% } %>
        
        <button type="submit">Se connecter</button>
      </form>
    </article>
  </main>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
