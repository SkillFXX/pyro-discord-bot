  'Lancer Pyro Bot': 'if [ -d .git ] && [ "${AUTO_UPDATE}" = "1" ]; then git reset --hard HEAD && git pull && npm install && npm run build; elif [ ! -d src/web/dist ]; then npm install && npm run build; fi; node src/index.js'
